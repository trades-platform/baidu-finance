[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "baidu-finance"
version = "0.1.0"
description = "Baidu market data SDK (stocks, industries, concepts, HK sectors)"
requires-python = ">=3.10"
dependencies = [
    "pandas>=1.5.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
disk = [
    "diskcache-rs>=0.4.10",
]
dev = [
    "pytest>=7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["baidu_finance"]

[tool.pytest.ini_options]
testpaths = ["tests"]
